<div class="shell">
  <header class="shell__header">
    <div class="shell__brand">Games Portal</div>
    <div class="shell__actions">
      @if (session.status() === 'anonymous' || session.status() === 'unknown') {
        <button type="button" class="btn" (click)="login()">Sign in</button>
      }
      @if (session.status() === 'authenticated') {
        <span class="shell__user">{{ session.displayName() }}</span>
        <button type="button" class="btn btn--ghost" (click)="logout()">Sign out</button>
      }
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
