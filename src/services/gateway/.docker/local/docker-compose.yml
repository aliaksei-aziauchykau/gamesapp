services:
  gateway:
    image: traefik:v2.11
    container_name: gamesapp-gateway
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${GAMESAPP_NETWORK_NAME:-vs-gamesapp-local-network}
      - --log.level=INFO
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --api.insecure=true
      - --ping=true
    ports:
      - "8083:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gamesapp-network
    restart: unless-stopped
