services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: gamesapp-keycloak
    command: start-dev --http-port=8080 --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - gamesapp-network
    restart: unless-stopped
