services:
  api:
    build:
      context: .
      dockerfile: src/services/api/.docker/local/Dockerfile
    container_name: gamesapp-api
    ports:
      - "5100:80"
    env_file:
      - ${API_ENV_FILE_PATH}
    environment:
      - ASPNETCORE_ENVIRONMENT=${API_ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${API_ASPNETCORE_URLS}
      - CORS_ALLOWED_ORIGINS=${API_CORS_ALLOWED_ORIGINS}
      - DATABASE_CONNECTION_STRING=${API_DATABASE_CONNECTION_STRING}
      - KEYCLOAK_AUTHORITY=${KEYCLOAK_AUTHORITY}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE}
      - KEYCLOAK_REQUIRE_HTTPS_METADATA=${KEYCLOAK_REQUIRE_HTTPS_METADATA}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - gamesapp-network
    restart: unless-stopped
