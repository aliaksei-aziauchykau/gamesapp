<gpll-panel [level]="1" navigationButtonName="Workspaces">
    <ng-template #panel>
        <mat-nav-list>
            <gpll-workspaces-list-fetcher>
                <ng-template let-workspaces>
                    <a mat-list-item *ngFor="let workspace of workspaces" [routerLink]="[workspace.workspaceId]">
                        {{ workspace.name }}
                    </a>
                </ng-template>
            </gpll-workspaces-list-fetcher>
            <!-- <a mat-list-item [routerLink]="['workspaces']">Workspaces</a> -->
        </mat-nav-list>
    </ng-template>
    <ng-template #panelContent><router-outlet></router-outlet></ng-template>
</gpll-panel>
