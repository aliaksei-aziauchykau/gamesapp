<ng-container *ngIf="!event.viewComponent; else load">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ event.name }}</mat-card-title>
            <mat-card-subtitle>{{ event.startDate }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>{{ event.description }}</p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-button>LIKE</button>
            <button mat-button>SHARE</button>
        </mat-card-actions>
    </mat-card>
</ng-container>

<ng-template #load> other view </ng-template>
