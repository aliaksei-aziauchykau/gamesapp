<shrl-with-button-to-scroll-decorator
    mode="dark"
    direction="down"
    position="center"
    buttonName="Даведацца больш"
    tooltipText="Go to Next Section"
    toLogicAnchorName="Project">
    <gpll-main-banner-section [shrlLogicAnchor]="'Introduction'" />
</shrl-with-button-to-scroll-decorator>

<div class="container mx-auto px-10">
    <shrl-with-button-to-scroll-decorator
        mode="dark"
        direction="down"
        buttonName="Як я магу далучыцца?"
        tooltipText="Go to Next Section"
        toLogicAnchorName="Goals">
        <gpll-project-description-section [shrlLogicAnchor]="'Project'" />
    </shrl-with-button-to-scroll-decorator>

    <shrl-with-button-to-scroll-decorator
        mode="dark"
        direction="down"
        tooltipText="Go to Next Section"
        toLogicAnchorName="Join">
        <gpll-goals-section [shrlLogicAnchor]="'Goals'" />
    </shrl-with-button-to-scroll-decorator>

    <shrl-with-button-to-scroll-decorator
        mode="dark"
        direction="down"
        tooltipText="Go to Next Section"
        toLogicAnchorName="Introduction">
        <gpll-join-section [shrlLogicAnchor]="'Join'" />
    </shrl-with-button-to-scroll-decorator>
