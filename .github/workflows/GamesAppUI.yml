name: GamesApp UI CI

on:
  push:
    branches: [master, main]
    paths:
      - src/services/ui/**
  pull_request:
    branches: [master, main]
    paths:
      - src/services/ui/**

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/services/ui/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
