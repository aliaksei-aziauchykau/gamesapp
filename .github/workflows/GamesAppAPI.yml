name: GamesApp API CI

on:
  push:
    branches: [master, main]
    paths:
      - src/services/api/**
      - src/services/database-migrator/**
      - GAA.sln
  pull_request:
    branches: [master, main]
    paths:
      - src/services/api/**
      - src/services/database-migrator/**
      - GAA.sln

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & build
        run: dotnet build GAA.sln -c Release

      - name: Test
        run: dotnet test GAA.sln -c Release --no-build
